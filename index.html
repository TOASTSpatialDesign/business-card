<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOAST Spatial Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; background-color: #0b0b0b; 
            font-family: 'Noto Serif TC', serif; 
        }
        
        .card { 
            width: 324px; height: 540px; background: #121212; 
            padding: 40px; text-align: center; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid #1a1a1a;
        }

        /* LOGO 與 品牌名稱設定 */
        .logo-svg { width: 140px; height: 140px; margin-bottom: 20px; }
        
        .brand-name {
            color: #FFFFFF; font-size: 40px; font-weight: 300;
            letter-spacing: 14px; margin-bottom: 10px;
            text-transform: uppercase; padding-left: 14px;
        }
        .brand-sub {
            color: #D4AF37; font-size: 11px; font-weight: 400;
            letter-spacing: 7px; text-transform: uppercase;
            padding-left: 7px; opacity: 0.85;
        }

        /* 控制間距的透明區塊 */
        .spacer { height: 60px; }

        /* 個人名片文字 */
        .name { font-size: 20px; margin: 10px 0 8px 0; letter-spacing: 2px; }
        .title { font-size: 13px; color: #D4AF37; margin-bottom: 45px; letter-spacing: 2px; }

        /* 按鈕系統 */
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { 
            display: block; width: 200px; margin: 0 auto;
            padding: 10px 0; border: 1px solid #D4AF37; 
            color: #D4AF37; text-decoration: none; font-size: 12px; 
            letter-spacing: 2px; transition: 0.3s;
        }
        .btn:hover { background: #D4AF37; color: #121212; }
    </style>
</head>
<body>

    <div class="card">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="10" y1="90" x2="90" y2="10" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.3"/>
            <path d="M25 75 L45 25 A 12 12 0 0 1 58 32 L40 80 Z" fill="#D4AF37" />
            <path d="M48 78 L65 35 A 10 10 0 0 1 73 42 L58 80 Z" fill="#D4AF37" opacity="0.8"/>
            <path d="M68 70 L80 48 A 6 6 0 0 1 84 53 L74 72 Z" fill="#D4AF37" opacity="0.5"/>
            <line x1="20" y1="80" x2="65" y2="80" stroke="#D4AF37" stroke-width="1.5" opacity="0.9"/>
        </svg>

        <div class="brand-name">Toast</div>
        <div class="brand-sub">Spatial Design</div>

        <div class="spacer"></div>

        <div class="name">吐司 @ 奧汀</div>
        <div class="title">Founder / Designer</div>

        <div class="btn-group">
            <a href="https://toastspatialdesign.github.io/Official-Site/" class="btn">OFFICIAL SITE</a>
            <a href="https://discord.gg/gXAAJV66bx" class="btn">JOIN DISCORD</a>
        </div>
    </div>

</body>
</html>
